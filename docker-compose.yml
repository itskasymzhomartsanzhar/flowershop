services:
  redis:
    image: redis:7-alpine
    container_name: flowershop_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - flowershop_redis_data:/data
    networks:
      - flowershop_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: flowershop_postgres
    restart: always
    environment:
      POSTGRES_DB: flowershop
      POSTGRES_USER: flowershop
      POSTGRES_PASSWORD: flowershop_db_pwd
    volumes:
      - flowershop_pg_data:/var/lib/postgresql/data
    networks:
      - flowershop_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowershop"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowershop_backend
    restart: always
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn backend.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120"
    volumes:
      - ./backend:/app
      - flowershop_static:/app/staticfiles
      - flowershop_media:/app/media
    environment:
      DEBUG: "False"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: "localhost,127.0.0.1,flowershop.swifttest.ru,flowershop_backend"
      SECRET_KEY: CHANGE_ME
      BOT_TOKEN: 7898807263:AAEVGakrVXbQxLXE7jeMTThmruE0ZXz9RBE
      ORDER_ASSEMBLERS_CHAT_ID: "-5162343685"
      FORCE_HTTPS_MEDIA: "True"
      YOOKASSA_ACCOUNT_ID: "1274505"
      YOOKASSA_SECRET_KEY: "live_3qkU7NMTBPyJaNnDTIAaHLkwIO0912AzkhCxcJPAfWk"
      PAYMENT_RETURN_URL: "https://t.me/srezflowers_bot"
      MOCK_PAYMENT_BUTTON: "False"
      DB_NAME: flowershop
      DB_USER: flowershop
      DB_PASSWORD: flowershop_db_pwd
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - flowershop_network
    ports:
      - "8120:8000"

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile.bot
    container_name: flowershop_bot
    restart: always
    command: sh -c "until python manage.py migrate --noinput; do echo 'Waiting for DB migrations...'; sleep 3; done; python main.py"
    volumes:
      - ./backend:/app
    environment:
      BOT_TOKEN: 7898807263:AAEVGakrVXbQxLXE7jeMTThmruE0ZXz9RBE
      REDIS_URL: redis://redis:6379/0
      ORDER_ASSEMBLERS_CHAT_ID: "-1003822871974"
      DB_NAME: flowershop
      DB_USER: flowershop
      DB_PASSWORD: flowershop_db_pwd
      DB_HOST: postgres
      DB_PORT: "5432"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - flowershop_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: flowershop_frontend
    restart: always
    networks:
      - flowershop_network
    ports:
      - "3120:80"

  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile.sync
    container_name: flowershop_sync
    restart: always
    environment:
      DB_NAME: flowershop
      DB_USER: flowershop
      DB_PASSWORD: flowershop_db_pwd
      DB_HOST: postgres
      DB_PORT: "5432"
      SPREADSHEET_ID: "1AShcy1aPMfiBSrv_vUVjsj7BYyUf_6Is-wsjO1KE4P4"
      SERVICE_ACCOUNT_FILE: /app/service_account.json
    volumes:
      - ./sync/service_account.json:/app/service_account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowershop_network

volumes:
  flowershop_static:
  flowershop_media:
  flowershop_redis_data:
  flowershop_pg_data:

networks:
  flowershop_network:
    driver: bridge
